<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Market Intelligence</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #f3f6fa;
        color: #172b42;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 36rem;
        padding: clamp(1.5rem, 5vw, 3rem);
        background: #fff;
        border: 1px solid #dce3eb;
        border-radius: 1rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      p { margin: 0; color: #226344; }
      p::before {
        content: "";
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        margin-right: 0.5rem;
        border-radius: 50%;
        background: #298052;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Market Intelligence</h1>
      <p>System is running</p>
    </main>
  </body>
</html>
